[config.site]
title = "Ahmat Fauzi"
description = "Full Stack Developer building REST APIs, web applications, and scalable systems."
pageTitle = "Ahmat Fauzi | Full Stack Developer"
pageDescription = "Personal portfolio of Ahmat Fauzi, a Full Stack Developer working with React, Node.js, Laravel, and Python."
url = "https://www.ahmatfauzi.my.id"
repository = "https://github.com/ahmatfauzy"
footerNote = "© 2026"

[config.theme]
# Available palettes:
# green-soft, green-vivid, rose-soft, pink-soft, purple-soft, blue-soft, orange-soft, brown-soft
palette = "green-soft"
# Native UI language. Unknown values fall back to en.
lang = "en"

[config.fonts]
# English and code-oriented UI fonts
en = "Maple Mono"
code = "Monaco"
# Built-in options: ChillRoundM, LXGW WenKai
# Chinese reading font
zh = "ChillRoundM"
# Full Chinese font file
file = "/fonts/ChillRoundM.ttf"

[config.code]
lightTheme = "catppuccin-latte"
darkTheme = "catppuccin-macchiato"
lineNumbers = true
wrap = true
preserveIndent = true
collapseStyle = "collapsible-auto"

[config.math]
render = "katex" # "katex" | "mathjax"

[config.comments]
enabled = false
provider = "none"
show_on_posts = true

[config.search]
enabled = true
shortcut = "mod+k"
placeholder = "Search notes..."
maxResults = 6

[config.pages.blog]
title = "Blog"
kicker = "Notebook archive"
subtitle = "Read what Ahmat Fauzi has been up to recently"
note = "Field notes, drafts, and technical margins arranged for slow browsing."
postsPerPage = 6
# Date format template used by date-fns.
dateFormat = "yyyy-MM-dd"
# Metadata separator. Use "|", "/", or the special value "icon".
metadataSeparator = "icon"
# Article list cover style: "card" keeps a bordered thumbnail, "mask" blends the image into the right side.
coverImageStyle = "mask"

[config.pages.blog.categories]
title = "Categories"
kicker = "Browse notes"
subtitle = ""
note = "A quiet index of recurring topics, gathered from article frontmatter."

[config.pages.blog.series]
title = "Series"
kicker = "Reading paths"
subtitle = ""
note = "Connected notes that can be followed in the order they were written."

[config.pages.projects]
title = "Projects"
kicker = "Project shelf"
subtitle = "Design and dev projects by Ahmat Fauzi"
note = "A compact shelf for implementation choices, releases, and publishing experiments."

[config.pages.vibe]
title = "Vibe"
kicker = ""
subtitle = "Life and coding fragments."
note = "Not formal enough for blog posts, but still part of the story."
showTrail = true

[config.pages.media]
title = "Media"
subtitle = "Books, films, and music — with a little of what I felt at the time."
note = "One page for books, films, series, albums, and podcasts."

[config.comments.giscus]
repo = ""
repo_id = ""
category = ""
category_id = ""
mapping = "pathname"
strict = "0"
reactions_enabled = "1"
emit_metadata = "0"
input_position = "top"
light_theme = "light"
dark_theme = "dark"
lang = "en"
loading = "lazy"

[config.comments.utterances]
repo = ""
issue_term = "pathname"
label = "comment"
theme = "github-light"

[config.comments.waline]
server_url = ""
lang = "en"
dark = "html.dark"
pageview = true
comment = true

[config.profile]
name = "Ahmat Fauzi"
handle = "@ahmatfauzy"
role = "Full Stack Developer"
email = "ahmatfauzi707@gmail.com"
website = "https://www.ahmatfauzi.my.id/"
github = "https://github.com/ahmatfauzy"
avatar = "/images/avatar.png"

